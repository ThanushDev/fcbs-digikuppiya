<!-- ✅ Fullscreen Image Viewer CSS -->
<style>
#imgViewer {
  display: none;
  position: fixed;
  z-index: 9999;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.9);
  justify-content: center;
  align-items: center;
  overflow: hidden;
}
#imgViewer img {
  max-width: 90%;
  max-height: 90%;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(255,255,255,0.3);
  transition: transform 0.3s ease;
}
#imgViewer .nav {
  position: absolute;
  top: 50%;
  font-size: 40px;
  color: white;
  cursor: pointer;
  user-select: none;
  transform: translateY(-50%);
  padding: 10px;
}
#prevBtn { left: 20px; }
#nextBtn { right: 20px; }
#closeBtn {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 35px;
  color: white;
  cursor: pointer;
}
</style>

<!-- ✅ Fullscreen Image Viewer Container -->
<div id="imgViewer">
  <span id="closeBtn">&times;</span>
  <span id="prevBtn" class="nav">&#10094;</span>
  <img src="" alt="Preview">
  <span id="nextBtn" class="nav">&#10095;</span>
</div>

<script src="script.js"></script>

<!-- ✅ Fullscreen Image Viewer Script -->
<script>
  const images = document.querySelectorAll("img");
  const viewer = document.getElementById("imgViewer");
  const viewerImg = viewer.querySelector("img");
  const closeBtn = document.getElementById("closeBtn");
  const nextBtn = document.getElementById("nextBtn");
  const prevBtn = document.getElementById("prevBtn");

  let currentIndex = 0;

  function showImage(index) {
    viewerImg.src = images[index].src;
    viewer.style.display = "flex";
    currentIndex = index;
  }

  images.forEach((img, index) => {
    img.addEventListener("click", () => showImage(index));
  });

  function closeViewer() {
    viewer.style.display = "none";
  }

  function showNext() {
    currentIndex = (currentIndex + 1) % images.length;
    showImage(currentIndex);
  }

  function showPrev() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    showImage(currentIndex);
  }

  nextBtn.addEventListener("click", e => {
    e.stopPropagation();
    showNext();
  });

  prevBtn.addEventListener("click", e => {
    e.stopPropagation();
    showPrev();
  });

  closeBtn.addEventListener("click", e => {
    e.stopPropagation();
    closeViewer();
  });

  viewer.addEventListener("click", closeViewer);

  // Keyboard navigation
  document.addEventListener("keydown", e => {
    if (viewer.style.display === "flex") {
      if (e.key === "ArrowRight") showNext();
      if (e.key === "ArrowLeft") showPrev();
      if (e.key === "Escape") closeViewer();
    }
  });

  // Swipe support for mobile
  let startX = 0;
  viewer.addEventListener("touchstart", e => startX = e.touches[0].clientX);
  viewer.addEventListener("touchend", e => {
    let endX = e.changedTouches[0].clientX;
    if (startX - endX > 50) showNext();
    if (endX - startX > 50) showPrev();
  });
</script>
